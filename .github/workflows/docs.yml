name: Documentation

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering on `branches: [main]`
  # meant a stacked pull request was never built: #35 was opened against
  # another pull request's branch, so the docs job never fired, and GitHub
  # reported "all checks passed" for the one check that did run while the
  # branch pinned a yani-core that does not exist. Retargeting to main when the
  # parent merged did not help either, since a base change raises
  # `pull_request: edited`, which is not a default trigger type.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    # Per branch rather than one queue for the whole workflow: builds are
    # independent of each other and only the deploy has to be serialised.
    # Sharing the deploy's group would make every pull request wait behind
    # every other one. A superseded build of the same branch is cancelled,
    # since nothing reads its result once a newer commit exists.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the docs toolchain and yani-core
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          # mkdocstrings reads the .pyi stubs shipped inside this wheel; there
          # is no Python in this repository for it to read instead. The pin
          # matches pyproject's, so the reference documents exactly the version
          # `pip install yani` resolves to.
          PIN="$(grep -oP 'yani-core==\K[^"]+' pyproject.toml)"
          pip install "yani-core==$PIN"

      - name: Build
        run: mkdocs build -f mkdocs.yml --strict

      - name: The API reference must have resolved, and must be complete
        shell: bash
        run: |
          # Two ways this page goes wrong, both of them silent. An empty
          # reference builds and deploys just as happily as a full one, so
          # assert griffe actually found the stubs. And the page names its
          # members one by one, so a name added to yani-core would simply never
          # appear here: assert the list still covers the module.
          python - <<'EOF'
          import pathlib, re, sys, yani

          # Deliberately undocumented, each for a reason. Anything not listed
          # here is expected on the page.
          UNDOCUMENTED = {
              # PyO3 submodules. Their contents are documented under the names
              # people write, `yani.sources.Histogram`, not as submodule pages.
              # `shapes` arrived with the self-shielding arguments in 0.12.0 and
              # is written up under Self-shielding.
              "data", "materials", "shapes", "sources",
              # The accessor pair behind each of the five nuclear-data
              # settings. The settings are the documented interface
              # (`yani.cross_section_data = "tendl-2025"`); nobody calls these.
              "get_cross_section_data", "set_cross_section_data",
              "get_transmutation_reactions", "set_transmutation_reactions",
              "get_transmutation_decay_data", "set_transmutation_decay_data",
              "get_transmutation_fission_yields", "set_transmutation_fission_yields",
              "get_transmutation_branch_ratios", "set_transmutation_branch_ratios",
          }

          html = pathlib.Path("site/api/index.html").read_text()
          # Top-level names only: a member heading is `yani.Material.activity`,
          # and the closing quote here excludes it.
          rendered = set(re.findall(r'id="yani\.([A-Za-z_][A-Za-z0-9_]*)"', html))
          expected = {n for n in yani.__all__ if not n.startswith("_")} - UNDOCUMENTED
          print(f"yani {yani.__version__}: {len(rendered)} members rendered, "
                f"{len(expected)} expected")

          missing = sorted(expected - rendered)
          if missing:
              print("::error::public names absent from the API reference:",
                    *missing, sep="\n  ")
          # Keeps the exclusion list honest: a name dropped from yani-core
          # should leave here too, rather than sitting as a silent excuse.
          stale = sorted(UNDOCUMENTED - set(yani.__all__))
          if stale:
              print("::error::excluded names are no longer on the module:",
                    *stale, sep="\n  ")
          if missing or stale:
              sys.exit(1)
          EOF

      - name: The documented examples must type-check against that wheel
        shell: bash
        run: |
          # The reference is generated from the wheel, so it cannot go stale.
          # The examples on the prose pages are hand-written and can: yani-core
          # 0.11.0 changed what `Material.transmute()` returns, and every
          # `results[-1]` here kept rendering while raising TypeError for
          # anyone who ran it. A type check against the shipped .pyi stubs
          # catches that without needing nuclear data or a solve.
          python docs/check_examples.py

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # main only, and never from a pull request, so a branch can be built
    # without publishing over what is live.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time; queued rather than cancelled so a merge is never
    # published over by an older run.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
