# MkDocs configuration for the yani docs.
#
# The API reference is generated by mkdocstrings from the type stubs inside the
# installed `yani-core` wheel, not from source: this repository holds no Python.
# `allow_inspection: false` is what makes that work, since the compiled
# extension carries no annotations and the committed `.pyi` files carry all of
# them.
#
# Build: mkdocs build -f mkdocs.yml   (needs `pip install yani-core` first)
site_name: yani
site_description: Yet Another Nuclide Inventory -- transmutation and activation without transport
site_url: https://fusion-neutronics.github.io/yani/
repo_url: https://github.com/fusion-neutronics/yani
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # Read the typed .pyi stubs statically instead of inspecting the
            # compiled extension (which carries no annotations).
            allow_inspection: false
            docstring_style: google
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            show_submodules: false
            filters: ["!^_"]
            extensions:
              - docs/griffe_ext.py:PyO3Constructor
              - docs/griffe_ext.py:PublicApi

extra_css:
  - css/api.css
  - css/nav.css

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables

nav:
  - Overview: index.md
  - Getting started: getting_started.md
  - Usage: usage.md
  - API reference: api.md
